services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: labcamp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: labcamp
    volumes:
      - labcamp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labcamp -d labcamp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://labcamp:${POSTGRES_PASSWORD}@postgres:5432/labcamp
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_URL: https://labcamp.duckdns.org
      NEXTAUTH_URL: https://labcamp.duckdns.org
      UPLOAD_DIR: /app/storage/uploads
      LOGIN_LOG_PRIVATE_IP_FALLBACK: ${LOGIN_LOG_PRIVATE_IP_FALLBACK:?Set LOGIN_LOG_PRIVATE_IP_FALLBACK in .env}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-ER0T1/LabCamp}
      GITHUB_CHANGELOG_LIMIT: ${GITHUB_CHANGELOG_LIMIT:-50}
      GITHUB_CHANGELOG_REF: ${GITHUB_CHANGELOG_REF:-}
      GITHUB_CACHE_DIR: /app/storage/git/labcamp.git
      NODE_ENV: production
    volumes:
      - uploads:/app/storage/uploads
      - changelog_git:/app/storage/git
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: development
    profiles: ["tools"]
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://labcamp:${POSTGRES_PASSWORD}@postgres:5432/labcamp
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/conf.d:/etc/nginx/conf.d:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - app

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  labcamp_data:
  uploads:
  changelog_git:
  letsencrypt:
  certbot_www:
